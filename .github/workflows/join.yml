name: Add member
on:
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: member-request-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  admit:
    if: >-
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'join-request') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/github-script@v7
        with:
          script: |
            const { admitMember } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/join-request.mjs`);
            core.info(`Join request #${context.payload.issue.number}: ${await admitMember({github, context})}`);
